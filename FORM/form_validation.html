<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <style>
        .input {
            padding: 10px;
            width: 300px;
            border-radius: 5px;
            background-color: rgb(225, 227, 227);
            font-size: 15px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif  ;
            padding-left: 20px;
            margin-left: ;
            
        }
        .input::placeholder{
            color: rgb(117, 65, 128);
        }

        .btn {
            margin-left: 62px;
            width: 200px;
            padding: 10px;
            background-color:aquamarine;
            border-radius: 5px;
            cursor: pointer;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-style: oblique;
            font-size: 18px;
        }

        .btn:hover {
            background-color: rgb(92, 230, 184);
        }
        .form{
            background-color: rgb(174, 236, 236);
                width: 500px;
                height: 500px;
                margin-left: 500px;margin-top: 80px;
                border: 1px solid black; border-radius: 10px;

        }
        .form1{
                
                
                margin-left: 83px; 
                margin-top: 50px;
        }
    </style>
</head>

<body>
    <form action="" class="form">
        <div class="form1">

            <h1 style="margin-left: 120px; margin-top: 10px;">Login</h1>
            <input type="text" placeholder="Enter Username" required autofocus maxlength="8" minlength="8" class="input" pattern="[A-Za-z0-9]{8}"> <br><br>
            <input type="password" placeholder="Enter Password" readonly requirecd class="input"> <br><br>
            <input type="email" placeholder="Enter Email" required class="input"> <br><br>
            <input type="tel" placeholder="Enter Contact No" required maxlength="10" minlength="10" class="input"> <br><br>
            <input type="date" placeholder="Date of Joining" required max="2025-04-20" min="2025-04-05" class="input"> <br><br>
            <button class="btn">Submit</button>
            
        </div>
    </form>
</body>

</html>
